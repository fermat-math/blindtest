<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="페르마 순공">
<link rel="manifest" href="manifest.webmanifest">
<title>페르마 순공 타이머</title>
<style>
:root{--bg:#0f1b2d;--card:#17263d;--line:#25395a;--ink:#eef3fb;--sub:#93a4bf;--blue:#2ea8ff;--cam:#2ea8ff;--btn:#ffb020;--red:#ff5d5d;--green:#33d17a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overscroll-behavior:none}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:20px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.big{font-size:44px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:99px;background:#0b1424;color:var(--sub)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.cam{background:var(--cam)}.btnc{background:var(--btn)}
.split{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#0b1424;margin:10px 0 6px}
.mode{flex:1;border-radius:16px;padding:16px 10px;text-align:center;background:#0b1424;border:2px solid var(--line)}
.mode b{display:block;font-size:17px;margin:6px 0 2px}.mode .ic{font-size:30px}
.mode.c{border-color:var(--cam)}.mode.b{border-color:var(--btn)}
input,select{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0b1424;color:var(--ink);margin:6px 0 10px}
.primary{width:100%;padding:15px;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;font-size:17px}
.ghost{padding:9px 13px;border-radius:11px;background:#0b1424;border:1px solid var(--line);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{padding:7px 12px;border-radius:99px;background:#0b1424;border:1px solid var(--line);font-size:14px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b1424;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;padding:11px 0 9px;background:none;color:var(--sub);font-size:12px}
.tabs button.on{color:var(--ink)}.tabs button i{display:block;font-style:normal;font-size:20px}
.seg{display:flex;background:#0b1424;border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:8px;border-radius:9px;background:none;color:var(--sub);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.rk{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rk .n{width:30px;text-align:center;font-weight:800;color:var(--sub)}
.rk.me{background:#1d3352;border-radius:10px}
.rk .nm{flex:1}.rk .t{font-weight:800;font-variant-numeric:tabular-nums}
.medal1 .n{color:#ffd24a}.medal2 .n{color:#cfd8e6}.medal3 .n{color:#e09a5c}
.hidden{display:none!important}
.net{font-size:12px;padding:3px 8px;border-radius:99px}
.net.on{background:#123a27;color:var(--green)}.net.off{background:#3a1d1d;color:#ff9a9a}
/* running screen */
#run{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
#run video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#run .ov{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(#000a,#0000 30%,#0000 65%,#000c)}
#run .clock{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px #000}
#run .state{text-align:center;font-weight:700;margin-top:4px}
#run.btnmode{background:radial-gradient(circle at 50% 35%,#2b2312,#000)}
#run.paused .clock{opacity:.45}
/* 절전 화면: 영상은 계속 확인하지만 화면은 거의 검게 */
#run.dim video{opacity:0}
#run.dim .ov{background:#000}
#run.dim .ov>*{opacity:.35}
#run.dim .runbtns,#run.dim #runToday,#run.dim .pill,#run.dim #noSave{visibility:hidden}
#run.dim .clock{font-size:44px;color:#9fb3cc}
#dimHint{display:none;text-align:center;color:#5d6f88;font-size:13px;margin-top:10px}
#run.dim #dimHint{display:block}
.runbtns{display:flex;gap:10px}
.runbtns button{flex:1;padding:17px;border-radius:16px;font-weight:800;font-size:17px;background:#ffffff22;backdrop-filter:blur(8px)}
.runbtns .stop{background:var(--red)}
.warn{background:#ff5d5dcc;color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:700;margin-top:10px}
.modal{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:20px;padding:22px;max-width:380px;width:100%;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal div{aspect-ratio:1;border-radius:6px;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff8}
.list .it{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tip{font-size:13px;color:var(--sub);line-height:1.6}
.tip b{color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<div id="run" class="hidden">
  <video id="vid" playsinline muted autoplay></video>
  <div class="ov">
    <div>
      <div class="row" style="justify-content:space-between">
        <span class="pill" id="runMode"></span><span class="pill" id="runSubj"></span>
      </div>
      <div style="margin-top:22px" class="clock" id="runClock">00:00:00</div>
      <div class="state" id="runState">공부 중</div>
      <div class="sub" style="text-align:center;margin-top:4px" id="runToday"></div>
      <div style="text-align:center;margin-top:8px"><span class="pill" id="faceSt"></span></div>
      <div class="sub" id="noSave" style="text-align:center;margin-top:6px;text-shadow:0 1px 4px #000">🔒 얼굴이 있는지만 감지해요 · 영상은 저장하거나 보내지 않아요</div>
      <div id="runWarn"></div>
      <div id="dimHint">절전 화면이에요 · 화면을 누르면 밝아져요</div>
    </div>
    <div>
      <div class="runbtns">
        <button id="bPause">일시정지</button>
        <button class="stop" id="bStop">공부 끝</button>
      </div>
    </div>
  </div>
</div>
<script>
/* ===== 설정 ===== */
const API='https://script.google.com/macros/s/AKfycbyzt_AuvfzMXuLG0IzsM_GzG-Kx7oqzvLBCkQ7eWxhmu_kDD6ETHH4fs39pB_b2kc_5PQ/exec';
const KEY='fermat.study.v1';
const SUBJ=['수학','영어','국어','과학','사회','기타'];
const CHECK_MIN=25;          /* 버튼 모드: 몇 분마다 "공부 중인가요?" 확인 */
const CHECK_WAIT=120;        /* 확인 버튼을 누를 때까지 기다리는 시간(초) */
const DARK_SEC=15;           /* (얼굴 감지가 안 될 때) 카메라가 이만큼 가려지면 자동 일시정지 */
const AWAY_SEC=10;           /* 얼굴이 이만큼 안 보이면 자리 이탈로 보고 멈춤, 그 시간은 뺌 */
const BACK_HITS=2;           /* 얼굴이 연속 이만큼 보이면 자동으로 다시 시작 */
const FACE_EVERY=2;          /* 배터리 절약: 몇 초마다 얼굴을 확인할지 */
const DIM_AFTER=60;          /* 배터리 절약: 화면을 안 만지면 몇 초 뒤 절전 화면 */
const MIN_SAVE=60;           /* 1분 미만 기록은 저장하지 않음 */

/* ===== 저장 ===== */
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
let S=load();S.sessions=S.sessions||[];S.unsent=S.unsent||[];S.subj=S.subj||'수학';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hms=s=>{s=Math.max(0,Math.floor(s));return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const hm=s=>{s=Math.round(s/60);const h=Math.floor(s/60),m=s%60;return h?`${h}시간 ${m}분`:`${m}분`};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>dkey(Date.now());
const gradeOf=cls=>{const m=String(cls).match(/^(\d)/);return m?m[1]:''};
const gradeName=g=>({7:'중1',8:'중2',9:'중3'}[g]||(g?g+'학년':''));
function sumBy(filter){let cam=0,btn=0;S.sessions.forEach(x=>{if(filter(x)){if(x.mode==='cam')cam+=x.sec;else btn+=x.sec}});return {cam,btn,all:cam+btn}}

/* ===== 네트워크: 기록은 모아서 아주 작게 보냄 ===== */
let online=navigator.onLine;
addEventListener('online',()=>{online=true;sync();render()});addEventListener('offline',()=>{online=false;render()});
async function sync(){
  if(!S.me||!S.unsent.length||!navigator.onLine)return;
  const list=S.sessions.filter(x=>S.unsent.includes(x.id)).slice(0,30);
  /* 한 기록 = id,시작(분 단위),초,모드,과목,이탈 */
  const d=list.map(x=>[x.id,Math.floor(x.start/60000),x.sec,x.mode==='cam'?'c':'b',SUBJ.indexOf(x.subj),x.leaves||0].join('.')).join('_');
  try{
    const r=await fetch(`${API}?action=study&cls=${encodeURIComponent(S.me.cls)}&name=${encodeURIComponent(S.me.name)}&d=${d}`,{cache:'no-store'});
    const j=await r.json();
    if(j.ok){const done=new Set(list.map(x=>x.id));S.unsent=S.unsent.filter(id=>!done.has(id));S.lastSync=Date.now();save();if(S.unsent.length)sync()}
  }catch(e){}
}
async function fetchRank(){
  if(!S.me||!navigator.onLine)return;
  try{
    const r=await fetch(`${API}?action=studyrank&cls=${encodeURIComponent(S.me.cls)}&name=${encodeURIComponent(S.me.name)}`,{cache:'no-store'});
    const j=await r.json();
    if(j.ok){S.rank={at:Date.now(),list:j.list};save();if(tab==='rank')render()}
  }catch(e){}
}

/* ===== 화면 ===== */
let tab='home';
function render(){
  const a=$('#app');
  if(!S.me){a.innerHTML=loginView();bindLogin();return}
  a.innerHTML=`<div class="wrap">${tab==='home'?homeView():tab==='stat'?statView():tab==='report'?reportView():tab==='rank'?rankView():helpView()}</div>
  <nav class="tabs">${[['home','⏱','타이머'],['stat','📊','내 기록'],['report','📝','리포트'],['rank','🏆','순위'],['help','❔','사용법']].map(([k,i,t])=>`<button data-tab="${k}" class="${tab===k?'on':''}"><i>${i}</i>${t}</button>`).join('')}</nav>`;
  a.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==='rank')fetchRank();render();scrollTo(0,0)});
  if(tab==='home')bindHome();if(tab==='rank')bindRank();if(tab==='stat')bindStat();if(tab==='report')bindReport();
}
function netPill(){return `<span class="net ${online?'on':'off'}">${online?'온라인':'오프라인'}${S.unsent.length?` · 보낼 기록 ${S.unsent.length}개`:''}</span>`}
let ROSTER=null,pickCls='';
async function loadRoster(){try{const r=await fetch('roster.json',{cache:'no-cache'});ROSTER=await r.json();try{localStorage.setItem(KEY+'.roster',JSON.stringify(ROSTER))}catch(e){}}catch(e){try{ROSTER=JSON.parse(localStorage.getItem(KEY+'.roster'))}catch(e2){}}if(!ROSTER)rosterFail=true;if(!S.me)render()}
let rosterFail=false;
function loginView(){
  if(!ROSTER)return `<div class="wrap"><h1>페르마 순공 타이머</h1><div class="card sub">${rosterFail?'처음 한 번은 인터넷이 필요해요. 인터넷에 연결한 뒤 다시 열어 주세요.':'명단을 불러오는 중…'}</div></div>`;
  const classes=[...new Set(ROSTER.map(r=>r.cls))];
  const names=pickCls?ROSTER.filter(r=>r.cls===pickCls):[];
  return `<div class="wrap"><h1>페르마 순공 타이머</h1>
  <div class="card"><div class="sub">내 반을 골라요</div><div class="chips">${classes.map(c=>`<button class="chip ${pickCls===c?'on':''}" data-cls="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
  ${pickCls?`<div class="card"><div class="sub">내 이름을 골라요</div><div class="chips">${names.map(r=>`<button class="chip" data-nm="${esc(r.name)}">${esc(r.name)}</button>`).join('')}</div></div>`:''}
  <p class="tip">이름이 없으면 선생님께 말씀해 주세요.</p></div>`}
function bindLogin(){
  document.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{pickCls=b.dataset.cls;render()});
  document.querySelectorAll('[data-nm]').forEach(b=>b.onclick=()=>{const n=b.dataset.nm;if(!confirm(`${pickCls} ${n} 맞나요?`))return;const me={cls:pickCls,name:n};S.me=null;switchUser(me);
    /* 블라인드 테스트에도 같은 이름으로 로그인 */
    try{const d=JSON.parse(localStorage.getItem('dabogi.v1')||'{}');if(!d._me){d._me=me;localStorage.setItem('dabogi.v1',JSON.stringify(d))}}catch(e){}
    render();sync();fetchRank()});
}
/* 학생마다 기록을 따로 보관해요 (한 휴대폰을 여러 학생이 써도 섞이지 않게) */
const ukey=m=>m?m.cls+'|'+m.name:'';
function switchUser(me){
  if(S.me&&ukey(S.me)===ukey(me))return;
  if(S.me){try{localStorage.setItem(KEY+'|'+ukey(S.me),JSON.stringify(S))}catch(e){}}
  let n=null;try{n=JSON.parse(localStorage.getItem(KEY+'|'+ukey(me)))}catch(e){}
  S=n||{sessions:[],unsent:[],subj:'수학'};S.sessions=S.sessions||[];S.unsent=S.unsent||[];S.me=me;save();
}
function hubMe(){try{const b=JSON.parse(localStorage.getItem('dabogi.v1')||'{}');return b._me&&b._me.name?{cls:b._me.cls,name:b._me.name}:null}catch(e){return null}}
/* 블라인드 테스트에서 로그인한 이름을 그대로 써요 */
{const hm0=hubMe();if(hm0)switchUser(hm0)}
/* ===== 개인 목표 (정하고 싶은 학생만) ===== */
const GOALS=[30,60,90,120,150,180,240,300];
function goalCard(todaySec){
  if(!S.goal)return `<button class="ghost" id="setGoal" style="width:100%;margin-bottom:12px;text-align:left">🎯 하루 목표 시간 정하기 <span class="sub">(선택)</span></button>`;
  const pct=Math.min(100,Math.round(todaySec/(S.goal*60)*100)),C=2*Math.PI*30;
  return `<div class="card row" style="gap:14px"><svg width="76" height="76" viewBox="0 0 76 76"><circle cx="38" cy="38" r="30" fill="none" stroke="#0b1424" stroke-width="9"/><circle cx="38" cy="38" r="30" fill="none" stroke="${pct>=100?'var(--green)':'var(--blue)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 38 38)"/><text x="38" y="43" text-anchor="middle" font-size="16" font-weight="800" fill="#eef3fb">${pct}%</text></svg>
   <div style="flex:1"><div class="sub">오늘 목표 ${hm(S.goal*60)}</div><div style="font-weight:800;font-size:18px;margin-top:2px">${pct>=100?'목표 달성! 🎉':'앞으로 '+hm(Math.max(0,S.goal*60-todaySec))}</div><button class="ghost" id="setGoal" style="margin-top:6px;font-size:13px;padding:6px 10px">목표 바꾸기</button></div></div>`}
function goalModal(){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="box"><h2 style="margin:0 0 6px">🎯 하루 목표 시간</h2><div class="sub">정하고 싶을 때만 정해요. 주간·월간 리포트에 달성률이 같이 나와요.</div><div class="chips" style="justify-content:center;margin:14px 0">${GOALS.map(g=>`<button class="chip ${S.goal===g?'on':''}" data-g="${g}">${hm(g*60)}</button>`).join('')}</div><button class="ghost" data-g="0" style="width:100%">목표 없이 쓰기</button></div>`;
  m.onclick=e=>{const b=e.target.closest('[data-g]');if(b){S.goal=+b.dataset.g||0;save();m.remove();render()}else if(e.target===m)m.remove()};
  document.body.appendChild(m)}
function homeView(){
  const t=sumBy(x=>dkey(x.start)===today());
  return `<a href="../" class="sub" style="text-decoration:none;display:inline-block;margin-bottom:4px">← 블라인드 테스트</a><div class="row" style="justify-content:space-between"><h1>${esc(S.me.name)}의 순공</h1>${netPill()}</div>
  <div class="card"><div class="sub">오늘 순공 시간</div><div class="big">${hms(t.all)}</div>
   <div class="split"><div class="cam" style="width:${t.all?t.cam/t.all*100:0}%"></div><div class="btnc" style="width:${t.all?t.btn/t.all*100:0}%"></div></div>
   <div class="row sub"><span><span class="dot cam"></span> 카메라 ${hm(t.cam)}</span><span style="margin-left:auto"><span class="dot btnc"></span> 버튼 ${hm(t.btn)}</span></div></div>
  ${goalCard(t.all)}
  <div class="card"><div class="sub">과목</div><div class="chips">${SUBJ.map(s=>`<button class="chip ${S.subj===s?'on':''}" data-subj="${s}">${s}</button>`).join('')}</div></div>
  <div class="row" style="align-items:stretch">
   <button class="mode c" id="goCam"><span class="ic">📷</span><b>카메라로 기록</b><span class="sub">얼굴이 보이게 세워 두기<br>얼굴 감지만, 영상 저장 없음</span></button>
   <button class="mode b" id="goBtn"><span class="ic">👆</span><b>버튼으로 기록</b><span class="sub">카메라가 안 될 때</span></button>
  </div>
  <p class="tip" style="margin-top:14px">타이머가 켜져 있는 동안 다른 앱으로 나가거나 화면을 끄면 시간이 바로 멈추고, 그 시간은 기록되지 않아요.</p>`;
}
function bindHome(){
  $('#setGoal')&&($('#setGoal').onclick=goalModal);
  document.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{S.subj=b.dataset.subj;save();render()});
  $('#goCam').onclick=()=>startRun('cam');$('#goBtn').onclick=()=>startRun('btn');
}
let statRange='week';
function statView(){
  const days=statRange==='week'?7:30,arr=[];
  for(let i=days-1;i>=0;i--){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);const k=dkey(d);arr.push({k,d,...sumBy(x=>dkey(x.start)===k)})}

  <div class="card tip"><b>👆 버튼으로 기록</b><br>카메라를 쓸 수 없을 때 써요. ${CHECK_MIN}분마다 "공부 중인가요?" 버튼이 뜨고, ${CHECK_WAIT/60}분 안에 누르지 않으면 그동안의 시간은 빠져요.</div>
  <div class="card tip"><b>⛔ 다른 앱을 못 쓰게 하려면</b><br>웹 페이지는 다른 앱을 막을 수 없어서, 다른 앱으로 나가면 타이머가 멈추고 그 시간은 빼요. 휴대폰 기능으로 이 화면에 고정해 두면 다른 앱을 열 수 없어요.<br><br>
  ${ios?`<b>아이폰</b>: 설정 → 손쉬운 사용 → 사용법 유도된 접근 켜기 → 타이머 화면에서 측면(홈) 버튼 세 번 누르기 → 시작`:`<b>안드로이드</b>: 설정 → 보안(또는 생체 인식 및 보안) → 앱 고정(화면 고정) 켜기 → 최근 앱 화면에서 이 앱 아이콘 → '이 앱 고정'`}</div>
  <div class="card tip"><b>🔋 배터리 아끼기</b><br>공부를 시작하고 ${DIM_AFTER}초 동안 화면을 안 만지면 화면이 거의 까맣게 바뀌어요(절전 화면). 카메라 확인과 시간 기록은 그대로 계속돼요. 화면을 누르면 다시 밝아져요. 오래 공부할 때는 충전기를 꽂아 두세요.</div>
  <div class="card tip"><b>📶 데이터 아끼기</b><br>기록은 휴대폰에 먼저 저장되고, 인터넷이 될 때 아주 작게 묶어서 보내요. 인터넷이 없어도 타이머와 내 기록은 그대로 쓸 수 있어요.</div>
  <div class="card tip"><b>홈 화면에 추가</b><br>${ios?'Safari 아래 공유 버튼 → 홈 화면에 추가':'크롬 ⋮ 메뉴 → 홈 화면에 추가(앱 설치)'}하면 앱처럼 쓸 수 있어요.</div>
  <div class="card"><div class="sub">${esc(S.me.cls)} ${esc(S.me.name)}</div><button class="ghost" id="logout" style="margin-top:8px">다른 이름으로 바꾸기</button></div>`;
}
document.addEventListener('click',e=>{if(e.target.id==='logout'){
  if(hubMe()){location.href='../#study';return}  /* 이름 바꾸기는 블라인드 테스트 화면에서 같이 해요 */
  if(S.me){try{localStorage.setItem(KEY+'|'+ukey(S.me),JSON.stringify(S))}catch(e){}}
  S={sessions:[],unsent:[],subj:'수학'};pickCls='';save();render()}});

/* ===== 타이머 ===== */
let R=null; /* 진행 중 상태 */
async function startRun(mode){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  R={mode,subj:S.subj,start:Date.now(),acc:0,lastTick:null,running:false,leaves:0,aways:0,dark:0,noFace:0,faceHits:0,awayPause:false,checkAt:0,checkShown:false,stream:null};
  const run=$('#run');run.classList.remove('hidden','btnmode','paused','dim');
  $('#runMode').innerHTML=mode==='cam'?'<span class="dot cam"></span> 카메라로 기록':'<span class="dot btnc"></span> 버튼으로 기록';
  $('#runSubj').textContent=R.subj;$('#runWarn').innerHTML='';
  try{await document.documentElement.requestFullscreen?.()}catch(e){}
  await keepAwake();
  if(mode==='cam'){
    try{R.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:480},height:{ideal:640}},audio:false});
      const v=$('#vid');v.srcObject=R.stream;await v.play().catch(()=>{});
      R.stream.getVideoTracks()[0].onended=()=>{pause('카메라가 꺼졌어요')};
      $('#faceSt').textContent='얼굴 감지 준비 중…';$('#faceSt').classList.remove('hidden');loadFace().then(ok=>{if(R)$('#faceSt').textContent=ok?'얼굴 감지 켜짐 · 누구인지는 알아보지 않아요':'얼굴 감지를 쓸 수 없어요 (카메라 가림만 확인)'});
    }catch(e){
      run.classList.add('hidden');R=null;releaseAwake();
      alert('카메라를 켤 수 없어요. 카메라 권한을 허용하거나, "버튼으로 기록"을 써 주세요.');return;
    }
    $('#noSave').classList.remove('hidden');
  }else{run.classList.add('btnmode');$('#faceSt').classList.add('hidden');$('#noSave').classList.add('hidden')}
  resume();
  R.timer=setInterval(tick,1000);
}
function resume(){if(!R)return;R.pausedAt=0;R.touch=Date.now();R.awayPause=false;R.noFace=0;R.running=true;R.lastTick=Date.now();R.checkAt=Date.now()+CHECK_MIN*60000;$('#run').classList.remove('paused');$('#bPause').textContent='일시정지';$('#runState').textContent='공부 중';$('#runWarn').innerHTML=''}
function pause(why){if(!R||!R.running)return;tick(true);R.running=false;R.pausedAt=Date.now();R.touch=Date.now();$('#run').classList.add('paused');$('#bPause').textContent='다시 시작';$('#runState').textContent='멈춤';if(why)$('#runWarn').innerHTML=`<div class="warn">${esc(why)}</div>`}
function tick(quiet){
  if(!R)return;const now=Date.now();
  if(R.running){
    const dt=(now-R.lastTick)/1000;
    /* 화면이 꺼지는 등 5초 넘게 비면 그 시간은 빼요 (다른 앱으로 나가면 visibilitychange에서 따로 멈춤) */
    if(dt<=5)R.acc+=dt;
    R.lastTick=now;
    if(!quiet&&R.mode==='cam'&&!faceOK)checkDark();
    if(!quiet&&R.mode==='btn'&&!R.checkShown&&now>=R.checkAt)showCheck();
  }
  R.tk=(R.tk||0)+1;
  if(quiet)return;
  if(R.mode==='cam'&&faceOK&&R.tk%FACE_EVERY===0)checkFace();
  const run=$('#run');
  const idle=now-(R.touch||R.start);
  if(!R.checkShown&&idle>(R.running?DIM_AFTER:120)*1000)run.classList.add('dim');
  /* 멈춘 채로 30분이 지나면 자동으로 공부를 끝내요 (카메라·화면이 계속 켜져 배터리가 닳지 않게) */
  if(!R.running&&R.pausedAt&&now-R.pausedAt>30*60000){finishRun('멈춘 채로 30분이 지나서 자동으로 끝냈어요.');return}
  $('#runClock').textContent=hms(R.acc);
  const t=sumBy(x=>dkey(x.start)===today()).all+R.acc;$('#runToday').textContent='오늘 합계 '+hms(t);
}
/* 카메라를 가리면(아주 어두우면) 멈춤 */
const cvs=document.createElement('canvas');cvs.width=32;cvs.height=24;const cx=cvs.getContext('2d',{willReadFrequently:true});
function checkDark(){
  const v=$('#vid');if(!v.videoWidth)return;
  cx.drawImage(v,0,0,32,24);const d=cx.getImageData(0,0,32,24).data;let s=0;for(let i=0;i<d.length;i+=4)s+=d[i]+d[i+1]+d[i+2];
  const avg=s/(d.length/4)/3;
  if(avg<18){R.dark++;if(R.dark>=DARK_SEC){R.acc=Math.max(0,R.acc-R.dark);R.dark=0;pause('카메라가 가려져서 멈췄어요. 얼굴이 보이게 놓고 다시 시작을 눌러요.')}}else R.dark=0;
}
/* 얼굴 감지(사람이 있는지만 확인, 누구인지 알아보지 않음): 얼굴이 AWAY_SEC초 동안 안 보이면 자리 이탈로 멈추고, 돌아오면 자동으로 다시 시작 */
let faceOK=false,faceLoading=null,faceBusy=false;
function loadFace(){
  if(faceOK)return Promise.resolve(true);
  if(faceLoading)return faceLoading;
  faceLoading=new Promise(res=>{const sc=document.createElement('script');sc.src='vendor/face-api.js';
    sc.onload=async()=>{try{await faceapi.nets.tinyFaceDetector.loadFromUri('vendor/');faceOK=true;res(true)}catch(e){res(false)}};
    sc.onerror=()=>res(false);document.head.appendChild(sc)}).then(ok=>{if(!ok)faceLoading=null;return ok});
  return faceLoading;
}
async function checkFace(){
  if(faceBusy||!R)return;const v=$('#vid');if(!v.videoWidth)return;faceBusy=true;
  let seen=false;
  try{seen=!!(await faceapi.detectSingleFace(v,new faceapi.TinyFaceDetectorOptions({inputSize:160,scoreThreshold:0.4})))}catch(e){}
  faceBusy=false;if(!R)return;
  if(seen){R.noFace=0;$('#faceSt').textContent='🙂 얼굴 감지 중';
    if(R.awayPause){R.faceHits++;if(R.faceHits>=BACK_HITS){R.faceHits=0;resume();$('#runWarn').innerHTML='<div class="warn" style="background:#33d17acc">돌아왔어요! 다시 기록해요.</div>';setTimeout(()=>{if(R&&R.running)$('#runWarn').innerHTML=''},3000)}}}
  else{R.faceHits=0;$('#faceSt').textContent='얼굴이 안 보여요';
    if(R.running){R.noFace+=FACE_EVERY;if(R.noFace>=AWAY_SEC){R.acc=Math.max(0,R.acc-R.noFace);R.noFace=0;R.aways++;pause(`자리를 비워서 멈췄어요 (${R.aways}번째). 얼굴이 다시 보이면 자동으로 다시 시작해요.`);R.awayPause=true}}}
}
/* 버튼 모드 확인 */
let checkTimer=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();[0,.35].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.25);o.connect(g).connect(actx.destination);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.3)})}catch(e){}}
function showCheck(){
  R.checkShown=true;$('#run').classList.remove('dim');const accAtCheck=R.acc;const m=document.createElement('div');m.className='modal';m.id='checkModal';
  let left=CHECK_WAIT;m.innerHTML=`<div class="box"><div style="font-size:40px">✋</div><h2 style="margin:6px 0">지금 공부 중인가요?</h2><div class="sub" id="cLeft"></div><button class="primary" style="margin-top:14px" id="cYes">네, 공부 중이에요</button></div>`;
  document.body.appendChild(m);try{navigator.vibrate?.([200,100,200])}catch(e){}beep();
  const upd=()=>{$('#cLeft').textContent=`${left}초 안에 눌러 주세요`};upd();
  checkTimer=setInterval(()=>{left--;upd();if(left<=0){clearInterval(checkTimer);m.remove();if(R){pause('확인 버튼을 누르지 않아서 멈췄어요. 확인 창이 뜬 뒤의 시간은 빠졌어요.');R.acc=accAtCheck;R.checkShown=false;$('#runClock').textContent=hms(R.acc)}}},1000);
  $('#cYes').onclick=()=>{clearInterval(checkTimer);m.remove();if(R){R.checkShown=false;R.checkAt=Date.now()+CHECK_MIN*60000}};
}
['pointerdown','touchstart'].forEach(ev=>$('#run').addEventListener(ev,()=>{if(R){R.touch=Date.now();$('#run').classList.remove('dim')}},{passive:true}));
$('#bPause').onclick=()=>{if(!R)return;R.running?pause():resume()};
$('#bStop').onclick=()=>finishRun();
function finishRun(autoMsg){
  if(!R)return;tick(true);clearInterval(R.timer);clearInterval(checkTimer);$('#checkModal')?.remove();
  const sec=Math.floor(R.acc);
  if(sec>=MIN_SAVE){const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),start:R.start,sec,mode:R.mode,subj:R.subj,leaves:R.leaves+R.aways};S.sessions.push(s);S.unsent.push(s.id)}
  save();
  if(R.stream)R.stream.getTracks().forEach(t=>t.stop());$('#vid').srcObject=null;
  releaseAwake();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
  $('#run').classList.add('hidden');const msg=(typeof autoMsg==='string'?autoMsg+' ':'')+(sec>=MIN_SAVE?`${hm(sec)} 기록했어요!`:'1분 미만은 기록하지 않아요.');R=null;tab='home';render();toast(msg);sync();
}
function toast(t){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box"><div style="font-size:36px">✅</div><h2 style="margin:8px 0">${esc(t)}</h2><button class="primary">확인</button></div>`;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)}
/* 다른 앱으로 나가면 바로 멈춤 */
document.addEventListener('visibilitychange',()=>{
  if(!R)return;
  if(document.hidden){if(R.running){tick(true);R.leaves++;pause(`다른 화면으로 나가서 멈췄어요 (${R.leaves}번째). 나가 있던 시간은 기록되지 않아요.`)}}
  else keepAwake();
});
addEventListener('pagehide',()=>{if(!R)return;
  if(R.running)tick(true);
  if(R.acc>=MIN_SAVE){const s={id:Date.now().toString(36)+'x',start:R.start,sec:Math.floor(R.acc),mode:R.mode,subj:R.subj,leaves:R.leaves+R.aways};S.sessions.push(s);S.unsent.push(s.id);save()}
  clearInterval(R.timer);clearInterval(checkTimer);$('#checkModal')?.remove();if(R.stream)R.stream.getTracks().forEach(t=>t.stop());$('#vid').srcObject=null;releaseAwake();
  $('#run').classList.add('hidden');R=null;render()});
/* 화면 꺼짐 방지 */
let wake=null,noSleepVid=null;
async function keepAwake(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  try{if('wakeLock' in navigator){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{if(R&&!document.hidden)setTimeout(keepAwake,500)});if(!ios)return}}catch(e){}
  /* Wake Lock이 없는 옛 휴대폰: 보이지 않는 영상을 반복 재생해서 화면이 안 꺼지게 */
  if(!noSleepVid){noSleepVid=document.createElement('video');noSleepVid.setAttribute('playsinline','');noSleepVid.muted=true;noSleepVid.loop=true;noSleepVid.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
    noSleepVid.src='data:video/mp4;base64,AAAAHGZ0eXBpc29tAAACAGlzb21pc28ybXA0MQAAAAhmcmVlAAAAG21kYXQAAAGzABAHAAABthADAowdbb9/AAAC6W1vb3YAAABsbXZoZAAAAAB8JbCAfCWwgAAAA+gAAAAAAAEAAAEAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAIAAAIVdHJhawAAAFx0a2hkAAAAD3wlsIB8JbCAAAAAAQAAAAAAAAPoAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAQAAAAAAgAAAAIAAAAAAAJGVkdHMAAAAcZWxzdAAAAAAAAAABAAAD6AAAAAAAAQAAAAABjW1kaWEAAAAgbWRoZAAAAAB8JbCAfCWwgAAAA+gAAAAAVcQAAAAAAC1oZGxyAAAAAAAAAAB2aWRlAAAAAAAAAAAAAAAAVmlkZW9IYW5kbGVyAAAAAThtaW5mAAAAFHZtaGQAAAABAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAD4c3RibAAAAJhzdHNkAAAAAAAAAAEAAACIbXA0dgAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAgACAASAAAAEgAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABj//wAAADJlc2RzAAAAAAOAgIAhAAEABICAgBMgEQAAAAAAAAAAAAAABYCAgAEUBoCAgAECAAAAGHN0dHMAAAAAAAAAAQAAAAEAAAPoAAAAFHN0c3oAAAAAAAAAEwAAAAEAAAAUc3RzYwAAAAAAAAABAAAAAQAAAAEAAAABAAAAFHN0Y28AAAAAAAAAAQAAACwAAABgdWR0YQAAAFhtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAACtpbHN0AAAAI6l0b28AAAAbZGF0YQAAAAEAAAAATGF2ZjU2LjQwLjEwMQ==';document.body.appendChild(noSleepVid)}
  noSleepVid.play().catch(()=>{});
}
function releaseAwake(){try{wake&&wake.release()}catch(e){}wake=null;noSleepVid&&noSleepVid.pause()}

/* ===== 시작 ===== */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
loadRoster();render();sync();setInterval(sync,5*60000);
</script>
